<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя 💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="floating-hearts" id="floatingHearts"></div>

    <div class="container" id="mainContainer">
        <div class="heart-icon">💖</div>
        <h1>Дашунька...</h1>
        <p class="main-text">
            Хочу пригласить тебя на волшебный выходные 21-22 числа вдвоём 🌹<br>
            Ты проведёшь эти выходные со мной?
        </p>
        <div class="buttons">
            <button id="yesBtn" class="btn btn-yes">Да, с радостью 💕</button>
            <button id="noBtn" class="btn btn-no">Не знаю...</button>
        </div>
    </div>

    <div class="success-message" id="successMessage">
        <div class="heart-icon big">💖</div>
        <h1>Ура!</h1>
        <p class="success-text">
            Я так счастлив! 🥰<br>
            Жду не дождусь нашей встречи!<br>
            Будет незабываемо 💕
        </p>
    </div>

    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="heart-icon">🥺</div>
            <h2>Ты уверена?</h2>
            <p>Может, всё-таки да? </p>
            <div class="modal-buttons">
                <button id="confirmNo" class="btn btn-no btn-small">Точно-точно нет</button>
                <button id="confirmYes" class="btn btn-yes btn-small">Ой, я передумала 💖</button>
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
